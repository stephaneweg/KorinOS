; Le préréglage d'export « Linux » : ce que fait Godot sous Windows pour Korin PC (docs/GODOT.md, « Exporter »).
; Le PCK reste à côté du binaire (embed_pck=false) ; le modèle de Korin le trouve par son nom.
[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../demo.x86_64"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
