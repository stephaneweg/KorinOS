; Le préréglage d'export « Linux » : ce que fait Godot sous Windows pour Korin PC (docs/GODOT.md, « Exporter »).
; Modèle personnalisé = le modèle d'export de Korin ; le greffon Korin Export (addons/korin_export) fait l'app
; demokorin.app à côté du fichier exporté et la copie dans SD0:/apps (korin/install_dir).
[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../export/demo.x86_64"

[preset.0.options]

custom_template/debug="/sd0/home/godot/demo.x86_64"
custom_template/release="/sd0/home/godot/demo.x86_64"
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
korin/make_app=true
korin/app_id="demokorin"
korin/category="Jeux"
korin/description="La démo de Godot sur Korin : un carré qui tourne, un cercle qui suit la souris."
korin/zip=true
korin/install_dir="/sd0/apps"
