<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <meshgradient id="m1" x="20" y="20" gradientUnits="userSpaceOnUse">
      <meshrow>
        <meshpatch>
          <stop path="c 40,-10 80,10 120,0" stop-color="#e33"/>
          <stop path="c 10,40 -10,80 0,120" stop-color="#ee3"/>
          <stop path="c -40,10 -80,-10 -120,0" stop-color="#3e3"/>
          <stop path="c -10,-40 10,-80 0,-120" stop-color="#33e"/>
        </meshpatch>
        <meshpatch>
          <stop path="c 40,0 80,0 120,0" stop-color="#ee3"/>
          <stop path="c 0,40 0,80 0,120" stop-color="#f0f"/>
          <stop path="c -40,0 -80,0 -120,0" stop-color="#0ff"/>
        </meshpatch>
      </meshrow>
    </meshgradient>
  </defs>
  <rect x="20" y="20" width="240" height="120" fill="url(#m1)"/>
</svg>
