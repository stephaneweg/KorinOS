# Plan d'essai de osinstall (tools/pc/installkey.py build --plan tools/pc/plan-test.ini) : à côté du faux Windows
# d'un disque de 6 Go (tools/pc/mktarget.sh), sans Setup ; petites tailles pour QEMU.
[disk]
device = blk.nvme0
mode = beside
root_fs = exfat
home = yes
root_gb = 2
home_fs = ext4
boot_mb = 128
min_gb = 1

[system]
hostname = korin-essai
lang = fr
keyb = BE
timeout = 3

[user]
name = alice
fullname = Alice Essai
autologin = yes
admin = yes
passwords = none
