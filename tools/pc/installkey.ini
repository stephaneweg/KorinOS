# installkey.ini : ce que la clé d'installation de Korin OS emporte (tools/pc/keyroot.py, tools/pc/installkey.py ;
# docs/etude/INSTALLATEUR.md §2.1, §4). La liste des paquets, leurs tailles et leurs catégories viennent de l'index
# signé du dépôt PC ; ce fichier dit seulement ce que l'index ne dit pas.

[categories]
# l'ordre des cartes de l'étape Logiciels (les autres catégories suivent), et celles cochées d'office
order = Système, Accessoires, Internet, Bureautique, Multimédia, Musique, Création, Développement, Jeux, Émulateurs
default = Système, Accessoires, Internet, Bureautique

[key]
# le système « live » de la clé : les paquets obligatoires (required = 1) de l'index, et ceux-ci (installés sur la
# clé, donc copiés tels quels sur le disque par osinstall)
system = pkgman
# le dépôt hors ligne : ces paquets en plus, en archives (.opk) dans /packages/pc de la clé, installables sans Internet
packages = archiver, calculator, clock, screenshot, pocketqi, calendar, cardfile, letters, notes, sheet, slides, pdf, budget, jet, mail, irc, telegram, imageview, photos, mediaplayer, music, media, recorder, piano
