## armpi.conf : la cible d'OpenSSL pour ARMPI (tools/openssl/build.sh, docs/OPENSSL.md).
## Comme linux-aarch64 (l'assembleur AArch64 d'OpenSSL, syntaxe GNU), sans libdl : newlib +
## libposix, programmes statiques.

my %targets = (
    "armpi-aarch64" => {
        inherit_from => [ "linux-aarch64" ],
        ex_libs      => "",
        dso_scheme   => undef,
    },
    ## le PC (Korin x86-64, tools/pc) : comme linux-x86_64 (l'assembleur x86-64 d'OpenSSL), sans libdl
    "korin-x86_64" => {
        inherit_from => [ "linux-x86_64" ],
        ex_libs      => "",
        dso_scheme   => undef,
    },
);
