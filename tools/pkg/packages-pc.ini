# tools/pkg/packages-pc.ini -- quels fichiers de build/pc/sysroot/ font chaque paquet du PC (docs/PAQUETS.md, « Le PC »).
# Lu par tools/pkg/mkrepo.py avec ARCH=x86_64 (ou BOARD=pc). Memes cles que packages.ini (le Pi), memes noms de
# paquets ; les versions sont dans versions.ini ([versions], et [pc] pour celles qui different du Pi). Le PC a son
# index a part, packages/pc/ (board = pc) ; un paquet de meme contenu qu'un paquet publie pour le Pi (memes fichiers,
# memes besoins : SoundFonts, exemples...) n'est pas refait : l'index du PC cite l'archive du Pi (../pkgs/, arch = any).
#
# Ce qui differe du Pi : pas de firmware du Pi, le systeme s'appelle pc (le chargeur EFI/Korin/korin.efi, le noyau et
# l'initrd de korin/, a la place de korin.ps1 install : boot =), tout est dans un seul arbre (pas de root =), Avalonia
# a son paquet. Jamais : etc/options.txt, etc/pointer.ini, etc/wifi*, korin/boot.cfg, .vibe/.env, .vibe/config.toml,
# acpi/ (refuses par mkrepo.py et checkrepo.py).
# Un fichier va a la premiere section qui le nomme. [*apps] fait de chaque app restante un paquet.

# le gestionnaire : son propre paquet, pour se mettre a jour sans le systeme (et avant lui)
[pkgman]
title    = Logiciels
category = Système
summary  = Les paquets : la commande pkg, le gestionnaire Logiciels (et son volet dans Réglages), le service pkgd
required = 1
files    = bin/pkg apps/pkgman.app/ sys/pkgd sys/applets/pkg.so

