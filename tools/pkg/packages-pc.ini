# et les competences) ; jamais .mai-acp/.env, config.toml ni sessions/ (a l'utilisateur). oai_acp reprend claude_acp,
# dans [claude] ; le client terminal (agent --mai) est dans [vibe].
[mai]
title    = MAI (Microsoft Foundry)
category = Développement
summary  = MAI, l'agent de code sur les modèles de Microsoft (MAI-Code), par votre déploiement Microsoft Foundry : l'app MAI, ou agent --mai au Terminal ; il lit, modifie, construit et essaie vos apps et le système, avec votre accord
files    = devtools/python/lib/python3.14/site-packages/oai_acp/ devtools/python/lib/python3.14/site-packages/claude_acp/ bin/mai-acp apps/mai.app/ .mai-acp/
config   = .mai-acp/AGENTS.md
needs    = vibe

# Mistral Vibe : ses paquets Python (le reste de site-packages, decoupe), vibe-acp, le client terminal agent, l'app
# Vibe, vibe-account et vibe-diag, et ce qu'il sait de Korin (.vibe : AGENTS.md, a l'utilisateur une fois pose, et les
# competences) ; jamais .vibe/.env ni .vibe/config.toml (les comptes de l'utilisateur)
[vibe]
title    = Mistral Vibe
category = Développement
summary  = L'agent de code de Mistral : l'app Vibe, le client terminal agent, vibe-acp, et ses compétences de Korin (apps en C, C#, FreeBASIC, diagnostic)
files    = devtools/python/lib/python3.14/site-packages/ devtools/python/ bin/vibe-acp bin/vibe-app-server bin/vibe-account bin/vibe-diag bin/agent apps/vibe.app/ .vibe/
config   = .vibe/AGENTS.md
needs    = python, bash, git, rg
split    = devtools/python/lib/python3.14/site-packages/ 90
release  = 1

# GNU bash : avant [pc], qui prend bin/ et etc/ ; le Terminal ouvre bash s'il est la, sinon sh
[bash]
title    = GNU bash
category = Développement
summary  = Le shell de GNU (5.2.37) : édition de ligne, historique, complétion, scripts ; le Terminal l'ouvre à la place de sh
files    = bin/bash etc/bash.bashrc etc/termcap
config   = etc/bash.bashrc

# llm (src/bin/llm) : l'aide reseau de « Composer avec l'IA » de Koton (OpenSSL) ; avant [pc], qui prend bin/
[llm]
title    = llm
category = Développement
summary  = Une réponse d'un modèle de langage (Gemini, Groq, Mistral, Claude, DeepSeek, Grok, OpenAI) en HTTPS, ou un téléchargement : l'aide de Koton, utilisable depuis le shell
files    = bin/llm

# llamacpp : llama.cpp construit dans Korin (tools/llamacpp/build.sh, arbre build/pc/llamacpp/tree) ; avant [pc], qui prend bin/
[llamacpp]
title    = llama.cpp
category = Développement
summary  = Les modèles de langage GGUF sur le processeur, en local : llama-server (API compatible OpenAI, pour OpenJarvis, Vibe...) et llama-cli (le chat au terminal) ; llama.cpp af5c583, AVX2, sans GPU ; modèles non fournis
files    = bin/llama-server bin/llama-cli

# rg : ripgrep reecrit en C sur PCRE2 ; avant [pc], qui prend bin/
[rg]
title    = ripgrep (rg)
category = Développement
summary  = La recherche rapide dans les fichiers (rg) : expressions PCRE2, .gitignore, types, sortie JSON ; celle dont Claude Code se sert
files    = bin/rg

# git : avant [pc], qui prend bin/ et etc/
[git]
title    = Git
category = Développement
summary  = Le gestionnaire de versions git 2.51 : dépôts locaux, clone, fetch et push en HTTP et HTTPS
files    = bin/git bin/git-core/ etc/gitconfig etc/git-core/
config   = etc/gitconfig

# Jet : le navigateur (WebKit, JavaScriptCore avec son JIT x86-64) ; gros : dans la Release
[app.jet]
summary  = Le navigateur, sur WebKit
release  = 1

# KorinStudio, l'IDE de Korin (docs/KORINSTUDIO.md) : construit par tools/korinstudio/build.sh, mis dans l'arbre par
# tools/pc/sysroot_craft.sh ; son copilote prend claude-code, claude-acp, vibe ou mai-acp s'ils sont installés
[app.korinstudio]
summary  = L'environnement de développement de Korin, à la manière de VS Code : Rust, C, C++, C#, FreeBASIC, assembleur, Python ; construire, lancer, erreurs cliquables, Git, terminal ; un copilote (Claude Code, Claude, Mistral Vibe, MAI) qui crée les projets et travaille dans l'IDE

# Forge, la CAO (docs/DESIGN-CAO.md) : OpenCASCADE relié dans l'app (pas besoin d'occt-dev)
# (sa compétence korin-forge, pour Vibe, Claude et MAI, est dans le dossier de l'app : apps/forge.app/SKILL.md)
[app.forge]
summary  = La CAO de Korin : solides exacts d'OpenCASCADE, formes au geste, pousser/tirer, congés sur toute arête, historique modifiable, pilotable par un agent (MCP)

