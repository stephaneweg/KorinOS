# L'hôte Linux (docs/etude/LINUX-HOST.md) : lance un programme de Linux x86-64 (glibc) sans le modifier, et xdg-open
# (une adresse web dans Jet) pour eux ; avant [pc], qui prend bin/
[linuxhost]
title    = Hôte Linux
category = Développement
summary  = Lance des programmes de Linux x86-64 sur Korin, sans les modifier (linuxhost run PROGRAMME) : ce qui fait tourner Claude Code
files    = bin/linuxhost bin/xdg-open

# Claude Code, la CLI officielle d'Anthropic (docs/etude/LINUX-HOST.md) : un paquet « virtuel », le binaire n'est jamais
# dans nos paquets : fetch le télécharge chez Anthropic à l'installation (pkglib.h), à la version épinglée ici avec son
# SHA-256 (celle essayée sur Korin ; manifest.json de downloads.claude.ai/claude-code-releases/VERSION). Une nouvelle
# version de Claude Code : changer fetch, essayer, monter la version du paquet (versions.ini). L'app Claude Code (le
# frontal en Rust, src/apps/claudecode : bash tools/claudecode/build.sh) va avec. pkgman >= 1.0.21 : le
# premier pkg qui connaît fetch (un plus ancien poserait la commande sans le binaire). Avant [pc] (bin/).
# korin-mcp (src/sys/mcp, docs/MCP-KORIN.md : sh tools/mcp/build.sh) : le serveur MCP de Korin, que /bin/claude
# passe à chaque séance (/etc/claude-code/mcp.json) ; Vibe s'en sert aussi s'il est là (libacp).
# les unixtools : BusyBox (tools/busybox), les commandes de Linux avec leurs options (env, awk, xargs, which, sed -E,
# grep -E, sort -k, find -regex, tar, sha256sum...) dans /devtools/bin, que les agents (claude) mettent devant /bin
[unixtools]
title    = Outils Unix
category = Développement
summary  = Les commandes de Linux avec leurs options habituelles (BusyBox) : awk, xargs, which, env, sed -E, grep -E, sort -k, find -regex, tar, diff, sha256sum... dans /devtools/bin, à côté de celles de /bin
files    = devtools/bin/
needs    = bash, pc >= 2026.11.76

[claude-code]
title    = Claude Code
category = Développement
summary  = Claude Code, l'agent de code d'Anthropic, par votre abonnement Claude (Pro, Max, Team) : la commande claude au Terminal, et Craft Anything s'en sert (téléchargé chez Anthropic à l'installation, 380 Mo)
files    = bin/claude bin/korin-mcp devtools/claude-code/ apps/claudecode.app/ etc/claude-code/
needs    = linuxhost, bash, git, rg, python, pkgman >= 1.0.21
fetch    = devtools/claude-code/claude 381121040 f390eaa0814e6a1bff74cbb47acb74cb9c89d30ced809fe0af5af00c7bfe8ebb https://downloads.claude.ai/claude-code-releases/2.1.330/linux-x64/claude

