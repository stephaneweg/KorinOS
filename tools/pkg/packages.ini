summary  = Le studio de musique

[app.letters]
summary  = Le traitement de texte

[app.sheet]
summary  = Le tableur

[app.slides]
summary  = Les présentations

[app.cardfile]
summary  = La base de données d'Onyx

[app.jet]
summary  = Le navigateur, sur WebKit

[app.mail]
summary  = Le courrier : Gmail, Outlook, IMAP, POP3

[app.paint]
summary  = Le dessin

