# tools/pkg/packages.ini -- quels fichiers de build/sdroot/ font chaque paquet (docs/PAQUETS.md).
# Lu par tools/pkg/mkrepo.py. Les versions sont dans versions.ini (le script les monte).
#
# Une section est un paquet : [nom] ([a-z0-9-]). Cles :
#   title, category, summary, author (ARMPI si absent)
#   files    = les chemins de la carte qu'il prend : un fichier, un dossier/ (tout dedans), un motif (* ?) ;
#              !motif : ceux qu'il laisse a un paquet plus loin
#   config   = ceux de ses fichiers qui sont a l'utilisateur (ecrits une fois, jamais ecrases s'ils ont change)
#   needs    = d'autres paquets ("fmtracker >= 1.0") ; "abi >= N" est ajoute depuis les tables des kits
#   required = 1 : ne se retire pas       restart = 1 : mis en place au prochain demarrage
#   replaces = les paquets dont il prend la place (un paquet renomme)
#   root     = dossier du depot ou prendre ses fichiers s'ils ne sont pas sur la carte
#   split    = MOTIF MO : ses fichiers qui suivent MOTIF vont dans des paquets <nom>-data-1.. de moins de MO Mo
#              chacun, dont il a besoin (GitHub refuse un fichier de plus de 100 Mo) ; l'index les marque
#              « part = <nom> » : Logiciels ne montre que le paquet, pkg les installe et les retire avec lui, jamais seuls
#   release  = 1 : ses archives vont dans la Release « packages » de KorinOS et non dans packages/ (GitHub Pages
#              refuse un site de plus de 1 Go) ; l'index donne leur adresse complete
# Un fichier va a la premiere section qui le nomme. [*apps] fait de chaque app restante un paquet (titre et categorie
# de son app.txt), avec [app.<nom>] pour ses extras. home/ : jamais ecrase, ecrit seulement s'il manque. var/ et
# etc/wifi* ne vont dans aucun paquet.

# le gestionnaire : son propre paquet, pour se mettre a jour sans le systeme (et avant lui). Requis ; pas etage : il
# s'installe aussitot, les programmes qui tournent restent en memoire (pkgman se relance lui-meme).
[pkgman]
title    = Logiciels
category = Système
summary  = Les paquets : la commande pkg, le gestionnaire Logiciels, le service pkgd
required = 1
files    = bin/pkg apps/pkgman.app/ sys/pkgd

# le firmware du Pi et celui du Wi-Fi : rarement mis a jour
[pi-firmware]
title    = Firmware du Raspberry Pi
category = Système
summary  = Le firmware de démarrage du Pi 4, les arbres des périphériques (Pi 4 et Pi 5), le firmware Wi-Fi
required = 1
restart  = 1
files    = start4.elf fixup4.dat *.dtb overlays/ firmware/

# (avant armpi : ils ne sont pas le systeme)
[soundfonts]
title    = Banque de sons General MIDI
category = Multimédia
summary  = GeneralUser GS : les instruments du synthétiseur MIDI d'AudioKit (sans elle, il joue sur sa banque FM)
files    = res/soundfonts/

# publish = 0 : le paquet existe sur la carte, mais ne va pas sur le depot public (les chansons de l'utilisateur,
# copiees de son dossier Music ; les essais)
[korin-srcs]
title    = Sources du système
category = Développement
summary  = Les sources de Korin OS, assemblables sur place par fasmarm (SD0:/src, SD0:/t)
files    = src/ t/
replaces = armpi-src

[basic-samples]
title    = Exemples BASIC
category = Développement
summary  = Les programmes d'exemple de BASIC
files    = basic/
needs    = armpi

[fmtracker-samples]
title    = Morceaux de FM Tracker
category = Multimédia
summary  = Les morceaux d'exemple de FM Tracker
files    = home/music/fms/
needs    = fmtracker

[koton-demos]
title    = Exemples de Koton Studio
category = Multimédia
summary  = Cinq morceaux d'exemple qui passent par tous les modules et greffons de Koton (aube, bossa, synthwave, rituel, valse), dans SD0:/home/koton/demos
files    = home/koton/demos/
needs    = koton

[koton-samples]
title    = Chansons de Koton
category = Multimédia
summary  = Des chansons pour Koton Studio
files    = home/koton/
needs    = koton
publish  = 0

[arabesque-samples]
title    = Préréglages d'Arabesque
category = Multimédia
summary  = Des morceaux d'exemple pour Arabesque (sonatine, ballade pour harpe, danse andalouse, rondo...), dans SD0:/home/arabesque
files    = home/arabesque/
needs    = arabesque

[home-samples]
title    = Documents d'exemple
category = Accessoires
summary  = Les documents, images et projets d'exemple de SD0:/home (jamais écrasés)
files    = home/

# les essais de WebKit, de .NET, d'OpenSSL, de la couche POSIX : pas le systeme
[webkit-tests]
title    = Essais de WebKit
category = Développement
summary  = jsc, wctest, wk2test : le moteur JavaScript et les essais de WebKit en ligne de commande
files    = bin/jsc bin/wctest bin/wk2test
publish  = 0

[system-tests]
title    = Essais du système
category = Développement
summary  = dotnetcheck, dotnethello, curltest, openssltest, posixtest, kptest : les essais des programmes portés
files    = bin/dotnetcheck bin/dotnethello bin/curltest bin/openssltest bin/openssltest-cxx bin/posixtest bin/posixtest-cxx bin/kptest
publish  = 0

# make et les regles de pibuild : de quoi construire un programme en assembleur sans le paquet gcc (avant [gcc] :
# le premier paquet qui nomme un fichier le prend)
[make]
title    = Make et PiBuild
category = Développement
summary  = make et les règles de pibuild (/gcc/bin/make, /gcc/share/pibuild.mk) : l'assembleur ; le C et le C++ avec gcc, le BASIC avec freebasic
files    = gcc/bin/make gcc/share/pibuild.mk
root     = build/gcc/sdroot

# FreeBASIC : fbc passe par GCC pour assembler et lier
[freebasic]
title    = FreeBASIC
category = Développement
summary  = Le compilateur FreeBASIC, sa bibliothèque, gfxlib2 sur UIKit et les .bi des kits (/gcc)
files    = gcc/bin/fbc gcc/include/freebasic/ gcc/lib/freebasic/ gcc/share/freebasic/
root     = build/gcc/sdroot
needs    = gcc

# GCC, .NET : leurs gros arbres, chacun son paquet
[gcc]
title    = GCC et G++
category = Développement
summary  = Le compilateur C et C++ de Korin OS, les relais des kits et les outils (/gcc)
files    = gcc/
root     = build/gcc/sdroot
needs    = make

[dotnet]
title    = .NET
category = Développement
summary  = Le runtime et le compilateur .NET, l'interface sur UIKit (/dotnet)
files    = dotnet/
root     = build/dotnet/sdroot

# GNU bash (tools/bash/build.sh -> prebuilt/bash, docs/BASH.md) : avant [armpi], qui prend bin/ et etc/ ; le
# Terminal ouvre bash s'il est la, sinon sh
[bash]
title    = GNU bash
category = Développement
summary  = Le shell de GNU (5.2.37) : édition de ligne, historique, complétion, scripts ; le Terminal l'ouvre à la place de sh
files    = bin/bash etc/bash.bashrc etc/termcap
config   = etc/bash.bashrc

# rg (docs/RG.md) : ripgrep reecrit en C sur PCRE2 (tools/rg/build.sh -> prebuilt/rg) ; avant [armpi], qui prend bin/
[rg]
title    = ripgrep (rg)
category = Développement
summary  = La recherche rapide dans les fichiers (rg) : expressions PCRE2, .gitignore, types, sortie JSON ; celle dont Claude Code se sert
files    = bin/rg

# Les essais avant Node.js (docs/TERMINAL-ET-FORK.md, étapes 1 à 9) : un script qui lance tous les essais sur le Pi et
# tire ce qu'il faut (le nouveau système, bash, git, rg, gcc). Ses fichiers : build/testing/sdroot (tools/testing/build.sh :
# le script et ses copies de posixtest, posixtest-cxx, dont le paquet system-tests n'est pas publié).
[testing_prep_nodejs]
title    = Essais avant Node.js
category = Développement
summary  = Les essais du terminal, de vterm, de fork, d'exec, de bash, du contrôle des tâches, de git et de rg sur le Pi : bash SD0:/test/prep_nodejs/run.sh
files    = test/prep_nodejs/
root     = build/testing/sdroot
needs    = armpi >= 2026.11.27, bash, git, rg, gcc >= 1.0.9

# git (docs/GIT.md) : avant [armpi], qui prend bin/ et etc/
[git]
title    = Git
category = Développement
summary  = Le gestionnaire de versions git 2.51 : dépôts locaux, clone, fetch et push en HTTP et HTTPS
files    = bin/git bin/git-core/ etc/gitconfig etc/git-core/
config   = etc/gitconfig
root     = build/git/sdroot

# le systeme : noyaux, modules, ce que lit le firmware, kits, services, programmes, reglages par defaut, polices et
# les apps du bureau. Etage : mis en place par pkg commit, au demarrage, avant les services.
[armpi]
title    = Système Korin OS
category = Système
summary  = Le noyau, les services, les kits, Elegant, les commandes de /bin et les apps de base
required = 1
restart  = 1
files    = kernel8.img kernel_2712.img *.mod config.txt README.TXT sys/ lib/ bin/ fonts/ res/ docs/ etc/ test.img test_exfat.img !sys/agenda !sys/stickies apps/control.app/ apps/files.app/ apps/terminal.app/ apps/welcome.app/ apps/viewer.app/ apps/editor.app/ apps/taskman.app/ apps/mixer.app/
config   = config.txt etc/dock.ini etc/drivers.txt etc/mounts.txt etc/panel.ini etc/paths.txt etc/places.ini etc/preload.txt etc/services.txt etc/session etc/startup.txt etc/system.ini etc/theme.txt etc/pkg/pkg.ini etc/applist.ini etc/options.txt etc/fileassoc.ini etc/init.txt etc/initramfs.txt

