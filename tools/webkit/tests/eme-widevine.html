<!doctype html>
<!--
  eme-widevine.html -- essai d'EME Widevine dans Jet (docs/etude/WIDEVINE.md, étape 5) : MSE + EME sur le flux
  Widevine public « Angel One » de Shaka (H.264 et AAC en « cenc »), servi à côté de la page (video.mp4,
  audio.mp4 : le début de chaque fichier). La licence vient du serveur de test de Shaka
  (cwip-shaka-proxy.appspot.com/no_auth) ; le module de Google tourne dans cdmhost (CDMWidevineOnyx) : il
  déchiffre l'audio et décode la vidéo. Chaque étape va au serveur de l'essai (GET /result?…) ;
  « EME-WIDEVINE : RÉUSSI » quand la lecture a passé 20 s (le chiffré, après la licence) avec au moins 100 images décodées.
  tools/linux/test_eme_jet.sh (KS=widevine) l'ouvre dans Jet sous QEMU.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>EME Widevine</title>
<style>
  body { font: 14px sans-serif; margin: 12px; }
  video { width: 384px; height: 288px; background: #000; }
  #log { white-space: pre-wrap; font: 12px monospace; }
</style>
</head>
<body>
<h1>EME Widevine</h1>
<video id="v" muted playsinline></video>
<div id="log"></div>
<script>
"use strict";
const LICENSE = "https://cwip-shaka-proxy.appspot.com/no_auth";
const v = document.getElementById("v");
let done = false;

function log(text) {
  console.log("EME-WIDEVINE : " + text);
  document.getElementById("log").textContent += text + "\n";
  fetch("result?" + encodeURIComponent("EME-WIDEVINE : " + text)).catch(() => {});
}
// (avec le temps écoulé depuis le chargement de la page : où part le temps, sous QEMU)
function tlog(text) {
  log(text + " [" + (performance.now() / 1000).toFixed(1) + " s]");
}
function fail(text) {
  if (done) return;
  done = true;
  log("ÉCHEC : " + text);
  document.title = "ÉCHEC";
}

async function setupKeys() {
  const config = [{
    initDataTypes: ["cenc"],
    videoCapabilities: [{ contentType: 'video/mp4; codecs="avc1.42c01e"', robustness: "SW_SECURE_DECODE" }],
    audioCapabilities: [{ contentType: 'audio/mp4; codecs="mp4a.40.2"', robustness: "SW_SECURE_CRYPTO" }],
  }];
  const access = await navigator.requestMediaKeySystemAccess("com.widevine.alpha", config);
  log("requestMediaKeySystemAccess : " + access.keySystem);
  // comme Netflix : des MediaKeys de sondage, chacun avec un certificat de serveur ; aucun ne doit lancer cdmhost
  // (tools/linux/test_eme_jet.sh compte les cdmhost démarrés)
  const probes = parseInt(new URLSearchParams(location.search).get("sondes") || "0");
  for (let i = 0; i < probes; i++) {
    const probe = await access.createMediaKeys();
    try { await probe.setServerCertificate(new Uint8Array([8, 5, 18, 4, 1, 2, 3, 4])); } catch (e) { log("sonde " + i + " : " + e.name); }
  }
  if (probes)
    log("sondes : " + probes + " MediaKeys avec un certificat de serveur");
  const keys = await access.createMediaKeys();
  log("createMediaKeys : fait (cdmhost démarre à la première session)");
  await v.setMediaKeys(keys);
  log("setMediaKeys : fait");
  let sessions = 0;
  v.addEventListener("encrypted", async (e) => {
    tlog("encrypted : " + e.initDataType + ", " + e.initData.byteLength + " octets");
    if (sessions++) return;   // (une session : la licence donne les clés de l'audio et de la vidéo)
    const session = keys.createSession("temporary");
    session.addEventListener("message", async (m) => {
      tlog("message : type " + m.messageType + ", " + m.message.byteLength + " octets");
      try {
        const r = await fetch(LICENSE, { method: "POST", body: m.message });
        const license = await r.arrayBuffer();
        tlog("licence : HTTP " + r.status + ", " + license.byteLength + " octets");
        await session.update(license);
        log("update : licence donnée");
      } catch (err) {
        fail("licence : " + (err && err.name ? err.name + " : " + err.message : String(err)));
      }
    });
    session.addEventListener("keystatuseschange", () => {
      let n = 0;
      session.keyStatuses.forEach((status) => { if (status === "usable") n++; });
      log("statuts de clés : " + session.keyStatuses.size + " clés, " + n + " utilisables");
    });
    try {
      await session.generateRequest(e.initDataType, e.initData);
      tlog("generateRequest : fait (session " + session.sessionId + ")");
    } catch (err) {
      fail("generateRequest : " + (err && err.name ? err.name + " : " + err.message : String(err)));
    }
  });
}

async function setupSource() {
  const ms = new MediaSource();
  v.src = URL.createObjectURL(ms);
  await new Promise((r) => ms.addEventListener("sourceopen", r, { once: true }));
  log("MediaSource ouverte");
  const tracks = [["video.mp4", 'video/mp4; codecs="avc1.42c01e"'], ["audio.mp4", 'audio/mp4; codecs="mp4a.40.2"']];
  await Promise.all(tracks.map(async ([url, type]) => {
    const sb = ms.addSourceBuffer(type);
    const data = await (await fetch(url)).arrayBuffer();
    sb.appendBuffer(data);
    await new Promise((r, j) => { sb.addEventListener("updateend", r, { once: true }); sb.addEventListener("error", j, { once: true }); });
    log(url + " : " + data.byteLength + " octets ajoutés, tampon " + (sb.buffered.length ? sb.buffered.end(0).toFixed(1) : 0) + " s");
  }));
}

v.addEventListener("waitingforkey", () => log("waitingforkey"));
v.addEventListener("error", () => fail("erreur du média " + (v.error ? v.error.code + " " + v.error.message : "")));
v.addEventListener("timeupdate", () => {
  if (done || v.currentTime < 20) return;
  const q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null;
  const frames = q ? q.totalVideoFrames : -1;
  // (sous QEMU, la licence peut arriver après 20 s : le début en clair de l'audio fait avancer la lecture ; on attend
  // jusqu'à 50 s que la vidéo chiffrée ait donné ses images)
  if (frames < 100 && v.currentTime < 50) return;
  tlog("lecture à " + v.currentTime.toFixed(1) + " s, images décodées " + frames);
  done = true;
  if (frames >= 100) {
    log("RÉUSSI");
    document.title = "RÉUSSI";
  } else
    fail("trop peu d'images décodées (" + frames + ")");
});

(async () => {
  try {
    log("début");
    await setupKeys();
    await setupSource();
    await v.play();
    tlog("play : en cours");
    setTimeout(() => { if (!done) fail("la lecture n'a pas atteint 20 s en 150 s (temps " + v.currentTime.toFixed(1) + ")"); }, 150000);
  } catch (e) {
    fail(e && e.name ? e.name + " : " + e.message : String(e));
  }
})();
</script>
</body>
</html>
