<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>A-Frame sur ARMPI</title>
<script>
window.addEventListener ("error", function (e) { document.title = "ERREUR " + e.message; });
var n = 0, t0 = performance.now ();
function count () {
	n++;
	var now = performance.now ();
	if (now - t0 >= 2000) {
		document.title = "A-Frame : " + (n * 1000 / (now - t0)).toFixed (1) + " images/s";
		n = 0;
		t0 = now;
	}
	requestAnimationFrame (count);
}
requestAnimationFrame (count);
</script>
<script src="aframe.min.js"></script>
</head>
<body>
<a-scene vr-mode-ui="enabled: false" renderer="antialias: false">
	<a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" animation="property: rotation; to: 0 405 0; loop: true; dur: 4000; easing: linear"></a-box>
	<a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
	<a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
	<a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
	<a-sky color="#ECECEC"></a-sky>
</a-scene>
</body>
</html>
