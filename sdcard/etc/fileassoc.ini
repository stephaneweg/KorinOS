# Associations des fichiers (UIKit : ui_assoc_open, ui_open_with) : « extension = application »,
# une par ligne ; l'application est le paquet SD0:/apps/<application>.app. Sans ligne ici, la
# première application dont le manifeste (app.txt : opens = ...) déclare l'extension ; sans
# application, l'Éditeur. « Ouvrir avec… », « Toujours » coché, écrit ici ; « ext = » : l'Éditeur.
# Les extensions que plusieurs applications déclarent :
txt  = editor
png  = photos
bmp  = photos
jpg  = photos
jpeg = photos
jpe  = photos
gif  = photos
webp = photos
pcx  = photos
fms  = media
