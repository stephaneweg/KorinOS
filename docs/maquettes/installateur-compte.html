<title>Installateur Korin : compte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Givre : l'écran plein de l'installateur ; le formulaire du compte, le reste se remplit d'après le nom */
:root {
  --face: #eef2f6; --surface: #ffffff; --creux: #e3e9f0; --ligne: #d3dce6; --ligne-forte: #aab8c7;
  --texte1: #18212b; --texte2: #4d5b6a; --texte3: #8593a3;
  --accent: #2f6fd6; --accent-clair: #e3edfc; --accent-fonce: #1c4f9e; --sur-accent: #ffffff;
  --succes: #2f8a57; --alerte: #a8670c; --alerte-clair: #fdf1de; --danger: #c23b32;
  --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --face: #12171d; --surface: #1a2129; --creux: #232c36; --ligne: #2e3a47; --ligne-forte: #4a5a6b;
  --texte1: #e8eef4; --texte2: #a6b4c2; --texte3: #6f7f90;
  --accent: #6aa0f0; --accent-clair: #1c2c44; --accent-fonce: #9cc0f6; --sur-accent: #0c1420;
  --succes: #6fc795; --alerte: #e9b45c; --alerte-clair: #36280f; --danger: #ef7d73; color-scheme: dark } }
:root[data-theme="dark"] {
  --face: #12171d; --surface: #1a2129; --creux: #232c36; --ligne: #2e3a47; --ligne-forte: #4a5a6b;
  --texte1: #e8eef4; --texte2: #a6b4c2; --texte3: #6f7f90;
  --accent: #6aa0f0; --accent-clair: #1c2c44; --accent-fonce: #9cc0f6; --sur-accent: #0c1420;
  --succes: #6fc795; --alerte: #e9b45c; --alerte-clair: #36280f; --danger: #ef7d73; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--face); color: var(--texte1); font: 14px/1.45 var(--f-ui);
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.ecran { max-width: 820px; margin: 0 auto; border: 1px solid var(--ligne); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: var(--face) }
.bande { display: flex; align-items: center; gap: 16px; padding: 0 18px; height: 48px; border-bottom: 1px solid var(--ligne) }
.marque { display: flex; align-items: center; gap: 8px; font-weight: 600 }
.losange { width: 12px; height: 12px; background: var(--accent); transform: rotate(45deg); border-radius: 2px }
.etapes { display: flex; gap: 18px; font-size: 13px; color: var(--texte3); margin-left: auto }
.etapes .fait { color: var(--texte2) } .etapes .fait::before { content: "✓ "; color: var(--succes) }
.etapes .cours { color: var(--texte1); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); padding-bottom: 2px }
.col { width: 100%; max-width: 680px; margin: 0 auto; padding: 32px 0 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0 }
h1 { font-size: 26px; line-height: 1.25; font-weight: 600; margin: 0 }
.grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px }
.champ { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.champ label, .etiq { font-size: 12.5px; color: var(--texte2); font-weight: 500 }
.aide { font-size: 12.5px; color: var(--texte3) }
.aide code { font-family: var(--f-mono); font-size: 12px; color: var(--texte2) }
input[type=text], .mdp { font: 14px var(--f-ui); border: 1px solid var(--ligne-forte); border-radius: 8px; background: var(--surface); color: var(--texte1); width: 100% }
input[type=text] { padding: 8px 10px }
input[type=text]:focus, .mdp:focus-within { outline: 2px solid var(--accent); outline-offset: 1px }
.mdp { display: flex; overflow: hidden }
.mdp input { flex: 1; min-width: 0; border: 0; background: none; padding: 8px 10px; font: 14px var(--f-ui); color: var(--texte1) }
.mdp input:focus { outline: none }
.oeil { border: 0; background: none; color: var(--texte2); padding: 0 10px; cursor: pointer; font: 12.5px var(--f-ui) }
.jauge { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--texte2) }
.jauge i { width: 28px; height: 4px; border-radius: 2px; background: var(--ligne) }
.jauge i.on { background: var(--succes) }
.ok { font-size: 12.5px; color: var(--succes) } .ko { font-size: 12.5px; color: var(--danger) }
.radios { display: flex; flex-direction: column; gap: 6px }
.radios label, .case { display: flex; gap: 8px; align-items: flex-start; cursor: pointer }
input[type=radio], input[type=checkbox] { accent-color: var(--accent); margin: 3px 0 0 }
.case b { font-weight: 500 }
.case span small { display: block; color: var(--texte3); font-size: 12.5px; margin-top: 2px }
.bloc { border-radius: 8px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--ligne); display: flex; flex-direction: column; gap: 12px }
.note { border-radius: 8px; padding: 10px 12px; font-size: 13.5px; background: var(--alerte-clair); color: var(--alerte) }
.pied { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--ligne); flex-wrap: wrap }
.etat { color: var(--texte2); font-size: 13px; flex: 1; min-width: 160px }
.btn { font: 500 14px var(--f-ui); border-radius: 8px; padding: 9px 18px; cursor: pointer; border: 1px solid var(--ligne-forte); background: var(--surface); color: var(--texte1) }
.btn.prim { background: var(--accent); border-color: var(--accent); color: var(--sur-accent); min-width: 160px }
.btn.fantome { background: none; border-color: transparent; color: var(--texte2) }
.btn:disabled { opacity: .45; cursor: default }
.btn:focus-visible, .oeil:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
@media (max-width: 560px) { .etapes { display: none } .grille { grid-template-columns: 1fr } h1 { font-size: 21px } }
</style>

<div class="ecran">
  <div class="bande">
    <div class="marque"><span class="losange" aria-hidden="true"></span>Korin OS</div>
    <div class="etapes"><span class="fait">Disque</span><span class="fait">Internet</span><span class="fait">Logiciels</span><span class="cours">Compte</span><span>Résumé</span></div>
  </div>
  <div class="col">
    <h1>Qui êtes-vous ?</h1>
    <div class="champ"><label for="nom">Votre nom</label><input type="text" id="nom" value="Stéphane" autocomplete="off"></div>
    <div class="grille">
      <div class="champ"><label for="pc">Nom de l'ordinateur</label><input type="text" id="pc"><span class="aide">Le nom qu'il a sur le réseau.</span><span class="ko" id="pc-e"></span></div>
      <div class="champ"><label for="user">Nom d'utilisateur</label><input type="text" id="user"><span class="aide" id="user-a"></span><span class="ko" id="user-e"></span></div>
    </div>
    <div class="grille">
      <div class="champ"><label for="pw">Mot de passe</label><div class="mdp"><input type="password" id="pw"><button class="oeil" data-c="pw">Afficher</button></div><div class="jauge" id="jauge"></div></div>
      <div class="champ"><label for="pw2">Confirmer le mot de passe</label><div class="mdp"><input type="password" id="pw2"><button class="oeil" data-c="pw2">Afficher</button></div><span id="pw2-m"></span></div>
    </div>
    <span class="aide" id="vide" hidden>Sans mot de passe, n'importe qui peut ouvrir votre session.</span>
    <div class="radios" role="radiogroup" aria-label="Ouverture de la session">
      <label><input type="radio" name="ses" id="auto" checked> Ouvrir ma session automatiquement</label>
      <label><input type="radio" name="ses" id="dem"> Demander mon mot de passe pour ouvrir la session</label>
    </div>
    <label class="case"><input type="checkbox" id="admin" checked><span><b>Peut administrer cet ordinateur</b><small>Installer des logiciels et changer les réglages du système, en redonnant son mot de passe. Le mot de passe de root sera le même ; il se change par <code>sudo passwd root</code>.</small></span></label>
    <div class="bloc" id="root" hidden>
      <span id="root-t" style="color:var(--texte2);font-size:13.5px"></span>
      <div class="grille">
        <div class="champ"><label for="rpw">Mot de passe de root</label><div class="mdp"><input type="password" id="rpw"><button class="oeil" data-c="rpw">Afficher</button></div><div class="jauge" id="rjauge"></div></div>
        <div class="champ"><label for="rpw2">Confirmer</label><div class="mdp"><input type="password" id="rpw2"><button class="oeil" data-c="rpw2">Afficher</button></div><span id="rpw2-m"></span></div>
      </div>
      <span class="ko" id="root-e"></span>
    </div>
  </div>
  <div class="pied">
    <button class="btn fantome">Retour</button>
    <span class="etat" id="etat"></span>
    <button class="btn prim" id="suite">Continuer</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let pcMain = false, userMain = false;
const RESERVES = ["system", "root", "admin", "user"];
function simple(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 24); }
function force(p) {
  if (!p) return 0;
  let s = 0; if (p.length >= 8) s++; if (p.length >= 12) s++; if (/[A-Z]/.test(p) && /[a-z]/.test(p)) s++; if (/[0-9]/.test(p) && /[^A-Za-z0-9]/.test(p)) s++;
  return Math.max(1, s);
}
function jauge(el, p) {
  const n = force(p), mots = ["", "faible", "moyen", "bon", "fort"];
  el.innerHTML = p ? [1, 2, 3, 4].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("") + ` Mot de passe ${mots[n]}` : "";
}
function confirme(a, b, el) {
  const x = $(a).value, y = $(b).value;
  el.className = !y ? "" : x === y ? "ok" : "ko";
  el.textContent = !y ? "" : x === y ? "✓ Identiques" : "Les deux mots de passe sont différents.";
  return !x || x === y;
}
function maj() {
  const nom = $("nom").value.trim(), first = simple(nom.split(/\s+/)[0] || "");
  if (!pcMain) $("pc").value = "korin-zbook";
  if (!userMain) $("user").value = first;
  const u = $("user").value;
  $("user-a").innerHTML = u ? `Son dossier : <code>/home/${u}</code>` : "";
  let ok = true;
  const ue = !u ? "Choisissez un nom d'utilisateur." : !/^[a-z][a-z0-9-]*$/.test(u) ? "Minuscules et chiffres, sans espace ni accent, une lettre d'abord." : RESERVES.includes(u) ? `« ${u} » est réservé au système.` : "";
  $("user-e").textContent = ue; if (ue) ok = false;
  const pe = /^[a-z0-9][a-z0-9-]{0,62}$/.test($("pc").value) ? "" : "Minuscules, chiffres et tirets.";
  $("pc-e").textContent = pe; if (pe) ok = false;
  jauge($("jauge"), $("pw").value);
  if (!confirme("pw", "pw2", $("pw2-m"))) ok = false;
  const pw = $("pw").value, admin = $("admin").checked;
  $("vide").hidden = !!pw;
  const besoinRoot = !admin || !pw;
  $("root").hidden = !besoinRoot;
  if (besoinRoot) {
    $("root-t").textContent = !admin
      ? "Quelqu'un d'autre administrera cet ordinateur : choisissez le mot de passe de root et donnez-le à cette personne."
      : "Sans mot de passe pour vous, root en a quand même un : choisissez-le.";
    jauge($("rjauge"), $("rpw").value);
    if (!confirme("rpw", "rpw2", $("rpw2-m"))) ok = false;
    let re = "";
    if (!$("rpw").value) { re = "Le mot de passe de root est obligatoire."; ok = false; }
    else if (!admin && pw && $("rpw").value === pw) { re = "Choisissez un autre mot de passe que le vôtre, sinon vous pourriez administrer quand même."; ok = false; }
    $("root-e").textContent = re;
  }
  $("suite").disabled = !ok;
  $("etat").textContent = ok ? `${nom || u} (${u})${admin ? ", administrateur" : ""}, ${$("auto").checked ? "session ouverte au démarrage" : "mot de passe demandé"}` : "";
}
$("pc").addEventListener("input", () => { pcMain = true; maj(); });
$("user").addEventListener("input", () => { userMain = true; maj(); });
["nom", "pw", "pw2", "rpw", "rpw2"].forEach(i => $(i).addEventListener("input", maj));
["auto", "dem", "admin"].forEach(i => $(i).addEventListener("change", maj));
document.querySelectorAll(".oeil").forEach(b => b.onclick = () => { const c = $(b.dataset.c); c.type = c.type === "password" ? "text" : "password"; b.textContent = c.type === "password" ? "Afficher" : "Cacher"; c.focus(); });
$("suite").onclick = () => { $("etat").textContent = "Étape suivante : Résumé."; };
maj();
</script>
