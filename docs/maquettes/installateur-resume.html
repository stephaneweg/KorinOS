<title>Installateur Korin : résumé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Givre : l'écran plein de l'installateur ; la liste des choix (Modifier), le bloc de ce qui sera effacé, la confirmation */
:root {
  --face: #eef2f6; --surface: #ffffff; --creux: #e3e9f0; --ligne: #d3dce6; --ligne-forte: #aab8c7;
  --texte1: #18212b; --texte2: #4d5b6a; --texte3: #8593a3;
  --accent: #2f6fd6; --accent-clair: #e3edfc; --accent-fonce: #1c4f9e; --sur-accent: #ffffff;
  --succes: #2f8a57; --succes-clair: #e5f4eb; --danger: #c23b32; --danger-clair: #fbe9e7; --alerte: #a8670c; --alerte-clair: #fdf1de;
  --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --face: #12171d; --surface: #1a2129; --creux: #232c36; --ligne: #2e3a47; --ligne-forte: #4a5a6b;
  --texte1: #e8eef4; --texte2: #a6b4c2; --texte3: #6f7f90;
  --accent: #6aa0f0; --accent-clair: #1c2c44; --accent-fonce: #9cc0f6; --sur-accent: #0c1420;
  --succes: #6fc795; --succes-clair: #17301f; --danger: #ef7d73; --danger-clair: #3a1d1b; --alerte: #e9b45c; --alerte-clair: #36280f; color-scheme: dark } }
:root[data-theme="dark"] {
  --face: #12171d; --surface: #1a2129; --creux: #232c36; --ligne: #2e3a47; --ligne-forte: #4a5a6b;
  --texte1: #e8eef4; --texte2: #a6b4c2; --texte3: #6f7f90;
  --accent: #6aa0f0; --accent-clair: #1c2c44; --accent-fonce: #9cc0f6; --sur-accent: #0c1420;
  --succes: #6fc795; --succes-clair: #17301f; --danger: #ef7d73; --danger-clair: #3a1d1b; --alerte: #e9b45c; --alerte-clair: #36280f; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--face); color: var(--texte1); font: 14px/1.45 var(--f-ui);
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.ecran { max-width: 820px; margin: 0 auto; border: 1px solid var(--ligne); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: var(--face) }
.bande { display: flex; align-items: center; gap: 16px; padding: 0 18px; height: 48px; border-bottom: 1px solid var(--ligne) }
.marque { display: flex; align-items: center; gap: 8px; font-weight: 600 }
.losange { width: 12px; height: 12px; background: var(--accent); transform: rotate(45deg); border-radius: 2px }
.etapes { display: flex; gap: 18px; font-size: 13px; color: var(--texte3); margin-left: auto }
.etapes .fait { color: var(--texte2) } .etapes .fait::before { content: "✓ "; color: var(--succes) }
.etapes .cours { color: var(--texte1); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); padding-bottom: 2px }
.col { width: 100%; max-width: 680px; margin: 0 auto; padding: 32px 0 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0 }
h1 { font-size: 26px; line-height: 1.25; font-weight: 600; margin: 0 }
.liste { background: var(--surface); border: 1px solid var(--ligne); border-radius: 8px }
.ligne { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--ligne); align-items: start }
.ligne:last-child { border-bottom: 0 }
.lbl { font-size: 13px; color: var(--texte2) }
.val { min-width: 0 }
.val small { display: block; color: var(--texte3); font-size: 12.5px }
.mono { font-family: var(--f-mono); font-size: 12.5px }
.mod { background: none; border: 0; color: var(--accent); font: 13px var(--f-ui); cursor: pointer; padding: 0 }
.mod:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px }
.mini { display: flex; height: 10px; border-radius: 3px; overflow: hidden; margin-top: 6px; border: 1px solid var(--ligne) }
.mini i { display: block; height: 100% }
.dep { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 13px }
.dep label { display: inline-flex; gap: 6px; align-items: center }
.dep select { font: 13px var(--f-ui); padding: 4px 6px; border: 1px solid var(--ligne-forte); border-radius: 6px; background: var(--surface); color: var(--texte1) }
input[type=radio] { accent-color: var(--accent) }
.bloc { border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px }
.bloc.ok { background: var(--succes-clair); color: var(--succes) }
.bloc.danger { background: var(--danger-clair); color: var(--danger) }
.bloc ul { margin: 0; padding-left: 18px }
.bloc b { font-weight: 600 }
.conf { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--texte1) }
.conf input { font: 500 14px var(--f-ui); padding: 7px 10px; border: 1px solid var(--danger); border-radius: 8px; width: 160px; background: var(--surface); color: var(--texte1) }
.conf input:focus { outline: 2px solid var(--danger); outline-offset: 1px }
.alerte { border-radius: 8px; padding: 10px 12px; font-size: 13.5px; background: var(--alerte-clair); color: var(--alerte) }
.demo { font-size: 12.5px; color: var(--texte3); display: flex; gap: 12px; flex-wrap: wrap }
.demo label { color: var(--texte2); display: inline-flex; gap: 6px; align-items: center }
.pied { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--ligne); flex-wrap: wrap }
.etat { color: var(--texte2); font-size: 13px; flex: 1; min-width: 160px }
.btn { font: 500 14px var(--f-ui); border-radius: 8px; padding: 9px 18px; cursor: pointer; border: 1px solid var(--ligne-forte); background: var(--surface); color: var(--texte1) }
.btn.prim { background: var(--accent); border-color: var(--accent); color: var(--sur-accent); min-width: 180px }
.btn.rouge { background: var(--danger); border-color: var(--danger); color: var(--sur-accent); min-width: 180px }
.btn.fantome { background: none; border-color: transparent; color: var(--texte2) }
.btn:disabled { opacity: .45; cursor: default }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
@media (max-width: 560px) { .etapes { display: none } .ligne { grid-template-columns: 1fr auto } .lbl { grid-column: 1 / -1 } h1 { font-size: 21px } }
</style>

<div class="ecran">
  <div class="bande">
    <div class="marque"><span class="losange" aria-hidden="true"></span>Korin OS</div>
    <div class="etapes"><span class="fait">Disque</span><span class="fait">Internet</span><span class="fait">Logiciels</span><span class="fait">Compte</span><span class="cours">Résumé</span></div>
  </div>
  <div class="col">
    <h1>Prêt à installer</h1>
    <div class="liste" id="liste"></div>
    <div id="bloc"></div>
    <div id="batt"></div>
    <div class="demo">Maquette : <label><input type="checkbox" id="d-eff"> une partition sera formatée (Windows)</label><label><input type="checkbox" id="d-bat"> sur batterie à 22 %</label></div>
  </div>
  <div class="pied">
    <button class="btn fantome">Retour</button>
    <span class="etat" id="etat"></span>
    <button class="btn prim" id="go">Installer</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const DISQUE = "PM981a";
let ouvreDep = false, dep = { def: "korin", delai: 5 };
function rendre() {
  const eff = $("d-eff").checked, bat = $("d-bat").checked;
  const place = eff ? "à la place de Windows (C:, 400 Go)" : "dans les 100 Go libres, à côté de Windows";
  const L = [
    ["Langue et clavier", "Français · Belgique · clavier BE<small>Fuseau : Europe/Brussels</small>"],
    ["Disque", `Samsung PM981a, 512 Go · Korin ${place}<small>Système 64 Go, mes fichiers (/home) 36 Go · la partition EFI est réutilisée</small>
      <div class="mini" aria-hidden="true"><i style="width:2%;background:var(--ligne-forte)"></i>${eff
        ? `<i style="width:50%;background:var(--accent)"></i><i style="width:28%;background:var(--accent-fonce)"></i><i style="width:19%;background:repeating-linear-gradient(45deg,var(--surface) 0 3px,var(--ligne) 3px 4px)"></i>`
        : `<i style="width:78%;background:var(--texte3)"></i><i style="width:12%;background:var(--accent)"></i><i style="width:7%;background:var(--accent-fonce)"></i>`}<i style="width:1%;background:var(--ligne-forte)"></i></div>`],
    ["Logiciels", "Système, Accessoires, Internet, Bureautique · 1,2 Go<small>0,8 Go à télécharger</small>"],
    ["Compte", "Stéphane (<span class=\"mono\">stephane</span>), administrateur<small>Session ouverte au démarrage</small>"],
    ["Démarrage", (eff ? "Korin OS démarre directement" : `Menu Korin OS / Windows, ${dep.def === "korin" ? "Korin" : "Windows"} dans ${dep.delai} s`) +
      (ouvreDep && !eff ? `<div class="dep"><label><input type="radio" name="def" value="korin" ${dep.def === "korin" ? "checked" : ""}> Korin d'abord</label><label><input type="radio" name="def" value="windows" ${dep.def === "windows" ? "checked" : ""}> Windows d'abord</label><label>Délai <select id="delai">${[0, 5, 10].map(d => `<option ${d === dep.delai ? "selected" : ""}>${d}</option>`).join("")}</select> s</label></div>` : "")],
    ["Nom de l'ordinateur", "<span class=\"mono\">korin-zbook</span>"]
  ];
  $("liste").innerHTML = L.map((l, i) => `<div class="ligne"><span class="lbl">${l[0]}</span><span class="val">${l[1]}</span>${l[0] === "Démarrage" && eff ? "<span></span>" : `<button class="mod" data-i="${i}">${l[0] === "Démarrage" ? (ouvreDep ? "Fermer" : "Modifier") : "Modifier"}</button>`}</div>`).join("");
  document.querySelectorAll(".mod").forEach(b => b.onclick = () => {
    const l = L[+b.dataset.i][0];
    if (l === "Démarrage") { ouvreDep = !ouvreDep; rendre(); return; }
    $("etat").textContent = `« Modifier » ouvre l'écran ${l === "Nom de l'ordinateur" ? "Compte" : l.split(" ")[0]}, puis « Revenir au résumé ».`;
  });
  document.querySelectorAll("input[name=def]").forEach(r => r.onchange = () => { dep.def = r.value; rendre(); });
  if ($("delai")) $("delai").onchange = () => { dep.delai = +$("delai").value; rendre(); };
  $("bloc").innerHTML = eff
    ? `<div class="bloc danger"><span><b>Sera effacé définitivement :</b></span><ul><li>Partition 2 : Windows (C:), 400 Go, contient Windows</li></ul>
       <div class="conf"><label for="nomd">Pour confirmer, tapez le nom du disque : <b>${DISQUE}</b></label><input id="nomd" autocomplete="off"></div></div>`
    : `<div class="bloc ok">Rien ne sera effacé. Windows et ses fichiers restent tels quels.</div>`;
  $("batt").innerHTML = bat ? `<div class="alerte">L'ordinateur est sur batterie (22 %). Branchez le chargeur pour installer.</div>` : "";
  const go = $("go");
  go.className = "btn " + (eff ? "rouge" : "prim");
  go.textContent = eff ? "Effacer et installer" : "Installer";
  const verif = () => {
    const okNom = !eff || ($("nomd") && $("nomd").value.trim().toLowerCase() === DISQUE.toLowerCase());
    go.disabled = bat || !okNom;
    $("etat").textContent = bat ? "Branchez le chargeur." : !okNom ? "Tapez le nom du disque pour confirmer." : "La seule écriture sur le disque : ce bouton.";
  };
  if ($("nomd")) $("nomd").oninput = verif;
  verif();
}
$("d-eff").onchange = rendre; $("d-bat").onchange = rendre;
$("go").onclick = () => { $("etat").textContent = "Étape suivante : Installation (la progression)."; };
rendre();
</script>
