<title>Installateur Korin : partitions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Givre, comme les maquettes validées : l'écran plein de l'installateur, une colonne, le pied Retour / bouton principal.
   Nouveau : à l'étape Disque, « Utiliser… » donne un rôle à une partition existante (/ ou /home), reformatée. */
:root {
  --face: #eef2f6; --surface: #ffffff; --creux: #e3e9f0; --ligne: #d3dce6; --ligne-forte: #aab8c7;
  --texte1: #18212b; --texte2: #4d5b6a; --texte3: #8593a3;
  --accent: #2f6fd6; --accent-clair: #e3edfc; --accent-fonce: #1c4f9e; --sur-accent: #ffffff;
  --danger: #c23b32; --danger-clair: #fbe9e7; --succes: #2f8a57; --succes-clair: #e5f4eb; --alerte: #a8670c; --alerte-clair: #fdf1de;
  --sel: #cfe0fa; --garde: #8fb9a0;
  --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --face: #12171d; --surface: #1a2129; --creux: #232c36; --ligne: #2e3a47; --ligne-forte: #4a5a6b;
  --texte1: #e8eef4; --texte2: #a6b4c2; --texte3: #6f7f90;
  --accent: #6aa0f0; --accent-clair: #1c2c44; --accent-fonce: #9cc0f6; --sur-accent: #0c1420;
  --danger: #ef7d73; --danger-clair: #3a1d1b; --succes: #6fc795; --succes-clair: #17301f; --alerte: #e9b45c; --alerte-clair: #36280f;
  --sel: #24406a; --garde: #3f6b52; color-scheme: dark } }
:root[data-theme="dark"] {
  --face: #12171d; --surface: #1a2129; --creux: #232c36; --ligne: #2e3a47; --ligne-forte: #4a5a6b;
  --texte1: #e8eef4; --texte2: #a6b4c2; --texte3: #6f7f90;
  --accent: #6aa0f0; --accent-clair: #1c2c44; --accent-fonce: #9cc0f6; --sur-accent: #0c1420;
  --danger: #ef7d73; --danger-clair: #3a1d1b; --succes: #6fc795; --succes-clair: #17301f; --alerte: #e9b45c; --alerte-clair: #36280f;
  --sel: #24406a; --garde: #3f6b52; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--face); color: var(--texte1); font: 14px/1.45 var(--f-ui);
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.ecran { max-width: 820px; margin: 0 auto; background: var(--face); border: 1px solid var(--ligne); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-height: 600px }
.bande { display: flex; align-items: center; gap: 16px; padding: 0 18px; height: 48px; border-bottom: 1px solid var(--ligne); flex-wrap: wrap }
.marque { display: flex; align-items: center; gap: 8px; font-weight: 600 }
.losange { width: 12px; height: 12px; background: var(--accent); transform: rotate(45deg); border-radius: 2px }
.etapes { display: flex; gap: 18px; font-size: 13px; color: var(--texte3); margin-left: auto }
.etapes span.fait { color: var(--texte2) }
.etapes span.cours { color: var(--texte1); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); padding-bottom: 2px }
.etapes span.saute { text-decoration: line-through; color: var(--texte3) }
.col { flex: 1; width: 100%; max-width: 680px; margin: 0 auto; padding: 36px 0 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0 }
h1 { font-size: 26px; line-height: 1.25; font-weight: 600; margin: 0; text-wrap: balance }
.chapeau { color: var(--texte2); font-size: 15px; margin: 0; max-width: 62ch }
.choix { display: flex; flex-direction: column; gap: 10px }
.carte { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--ligne); border-radius: 10px; padding: 14px 16px; cursor: pointer }
.carte.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-clair) }
.carte input { margin-top: 3px; accent-color: var(--accent) }
.carte b { font-weight: 600; display: block }
.carte .sous { color: var(--texte2); font-size: 13px; margin-top: 2px }
.carte:focus-within { outline: 2px solid var(--accent); outline-offset: 2px }
.liste { background: var(--surface); border: 1px solid var(--ligne); border-radius: 8px; overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 480px }
th { text-align: left; font-weight: 500; color: var(--texte2); font-size: 12.5px; padding: 8px 12px; border-bottom: 1px solid var(--ligne); background: var(--creux) }
td { padding: 9px 12px; border-bottom: 1px solid var(--ligne); white-space: nowrap }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums }
tr:last-child td { border-bottom: 0 }
tbody tr { cursor: pointer }
tbody tr:hover td { background: var(--creux) }
tbody tr.sel td { background: var(--sel) }
tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
.pastille { display: inline-block; font-size: 11.5px; font-weight: 500; padding: 1px 7px; border-radius: 99px; background: var(--accent-clair); color: var(--accent-fonce); margin-left: 8px; vertical-align: 1px }
.liens { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 13.5px }
.lien { background: none; border: 0; padding: 4px 0; color: var(--accent); font: inherit; cursor: pointer }
.lien:disabled { color: var(--texte3); cursor: default }
.note { border-radius: 8px; padding: 10px 12px; font-size: 13.5px }
.note b { font-weight: 600 }
.note.info { background: var(--accent-clair); color: var(--accent-fonce) }
.note.ok { background: var(--succes-clair); color: var(--succes) }
.note.danger { background: var(--danger-clair); color: var(--danger) }
.note.alerte { background: var(--alerte-clair); color: var(--alerte) }
.pied { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--ligne); flex-wrap: wrap }
.etat { color: var(--texte2); font-size: 13px; flex: 1; min-width: 160px }
.btn { font: 500 14px var(--f-ui); border-radius: 8px; padding: 9px 18px; cursor: pointer; border: 1px solid var(--ligne-forte); background: var(--surface); color: var(--texte1) }
.btn.prim { background: var(--accent); border-color: var(--accent); color: var(--sur-accent); min-width: 160px }
.btn.rouge { background: var(--danger); border-color: var(--danger); color: var(--sur-accent); min-width: 160px }
.btn.fantome { background: none; border-color: transparent; color: var(--texte2) }
.btn:disabled { opacity: .45; cursor: default }
.btn:focus-visible, .lien:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.barre { display: flex; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--ligne) }
.barre > div { display: flex; flex-direction: column; justify-content: center; padding: 0 10px; min-width: 0; overflow: hidden; white-space: nowrap; font-size: 12.5px }
.barre .b-boot { background: var(--ligne-forte); color: var(--texte1); flex: 0 0 64px }
.barre .b-sys { background: var(--accent); color: var(--sur-accent) }
.barre .b-home { background: var(--accent-fonce); color: var(--surface) }
.barre .b-garde { background: var(--garde); color: var(--texte1) }
.barre b { font-size: 15px; font-weight: 600 }
.taille { display: flex; gap: 12px; align-items: center }
.taille input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0 }
.champ { display: flex; align-items: center; gap: 6px }
.champ input { width: 80px; font: 500 14px var(--f-ui); padding: 7px 8px; border: 1px solid var(--ligne-forte); border-radius: 6px; background: var(--surface); color: var(--texte1); text-align: right; font-variant-numeric: tabular-nums }
.bornes { display: flex; justify-content: space-between; font-size: 12px; color: var(--texte3); font-variant-numeric: tabular-nums }
.fs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
@media (max-width: 560px) { .fs { grid-template-columns: 1fr } .etapes { display: none } h1 { font-size: 21px } .col { padding-top: 22px } }
.resume { background: var(--surface); border: 1px solid var(--ligne); border-radius: 8px }
.resume div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--ligne); flex-wrap: wrap }
.resume div:last-child { border-bottom: 0 }
.resume span:first-child { color: var(--texte2); font-size: 13px }
.repris { background: var(--surface); border: 1px solid var(--ligne); border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13.5px }
.repris span:nth-child(odd) { color: var(--texte2) }
.mono { font-family: var(--f-mono); font-size: 12.5px }
h2 { font-size: 15px; font-weight: 600; margin: 4px 0 0 }
.scen { max-width: 820px; margin: 0 auto 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--texte2) }
.scen button { font: 500 13px var(--f-ui); padding: 5px 12px; border-radius: 99px; border: 1px solid var(--ligne-forte); background: var(--surface); color: var(--texte1); cursor: pointer }
.scen button[aria-pressed="true"] { background: var(--texte1); color: var(--face); border-color: var(--texte1) }
.scen button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.voile { position: fixed; inset: 0; background: rgba(15, 22, 30, .45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5 }
.dlg { background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; width: 100%; max-width: 460px; padding: 20px; display: flex; flex-direction: column; gap: 12px }
.dlg h2 { font-size: 18px; margin: 0 }
.dlg p { margin: 0; color: var(--texte2) }
.dlg .act { display: flex; justify-content: flex-end; gap: 8px }
.dlg label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer }
.dlg label.opt input { margin-top: 3px; accent-color: var(--accent) }
.dlg label.opt span small { display: block; color: var(--texte2); font-size: 12.5px }
.dlg select { font: 14px var(--f-ui); padding: 7px 8px; border: 1px solid var(--ligne-forte); border-radius: 6px; background: var(--surface); color: var(--texte1) }
.usage { font-weight: 500; color: var(--accent-fonce) }
.usage.efi { color: var(--texte2); font-weight: 400 }
td.u { min-width: 170px }
</style>

<div class="ecran">
  <div class="bande">
    <div class="marque"><span class="losange" aria-hidden="true"></span>Korin OS</div>
    <div class="etapes" id="etapes"></div>
  </div>
  <div class="col" id="col"></div>
  <div class="pied" id="pied"></div>
</div>
<div id="dlg"></div>

<script>
/* Nouvelle installation sur des partitions existantes : chaque ligne peut recevoir un rôle (Utiliser…) : le système de
   Korin (/) ou mes fichiers (/home), formatée dans le système de fichiers choisi. Choisir une ligne sans rôle garde le
   parcours validé : Korin s'y installe, et l'étape suivante peut en réserver une partie pour /home. */
const DISQUE = [
  { nom: "Partition 1 : EFI", taille: 0.5, type: "Système (EFI)", genre: "efi" },
  { nom: "Partition 2 : Windows (C:)", taille: 300, type: "Principal (NTFS)", genre: "windows" },
  { nom: "Partition 3 : KORIN OS", taille: 64, type: "Principal (FAT32)", genre: "data" },
  { nom: "Partition 4 : KORIN HOME", taille: 135, type: "Principal (exFAT)", genre: "data" },
  { nom: "Espace non alloué", taille: 12, type: "", genre: "libre" },
  { nom: "Partition 5 : Récupération", taille: 1, type: "Récupération", genre: "rec" }
];
const MIN = 10;
let sel = 2, page = "disque", fait = false;
let roles = {};            // rang de la ligne -> { r: "root" | "home", fs }
const go = v => (v < 1 ? v.toLocaleString("fr-BE", { maximumFractionDigits: 1 }) : v.toLocaleString("fr-BE", { maximumFractionDigits: 0 })) + " Go";
const el = h => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const nomCourt = p => p.nom.includes(" : ") ? p.nom.split(" : ")[1] : p.nom;
const ligneDe = r => Object.keys(roles).map(Number).find(i => roles[i].r === r);
const FS = { fat32: "FAT32", exfat: "exFAT", ext4: "ext4" };

function bande() {
  const et = [["disque", "Disque"], ["internet", "Internet"], ["logiciels", "Logiciels"], ["compte", "Compte"], ["resume", "Résumé"]];
  const ordre = et.map(e => e[0]), ici = ordre.indexOf(page);
  const b = document.getElementById("etapes");
  b.innerHTML = "";
  et.forEach(([k, t], i) => b.append(el(`<span class="${k === page ? "cours" : i < ici ? "fait" : ""}">${i < ici ? "✓ " : ""}${t}</span>`)));
}

function usage(i) {
  const p = DISQUE[i];
  if (p.genre === "efi") return `<span class="usage efi">démarrage (gardée)</span>`;
  const r = roles[i];
  if (!r) return "";
  return `<span class="usage">${r.r === "root" ? "/" : "/home"} · ${p.genre === "libre" ? "nouvelle partition" : "formatée"}, ${FS[r.fs]}</span>`;
}

/* ce que donneront les choix : Suivant permis ? */
function verdict() {
  const ir = ligneDe("root"), ih = ligneDe("home");
  if (ir !== undefined) {
    const efface = [ir, ih].filter(i => i !== undefined && DISQUE[i].genre !== "libre").map(i => `${nomCourt(DISQUE[i])} (${go(DISQUE[i].taille)})`);
    let t = `<b>/</b> dans ${nomCourt(DISQUE[ir])} (${go(DISQUE[ir].taille)}, ${FS[roles[ir].fs]})`;
    t += ih !== undefined ? `, <b>/home</b> dans ${nomCourt(DISQUE[ih])} (${go(DISQUE[ih].taille)}, ${FS[roles[ih].fs]}).` : ", /home dans le système.";
    return { ok: true, danger: efface.length > 0, explicite: true, note: [efface.length ? "danger" : "ok", t + (efface.length ? ` <b>Seront formatées :</b> ${efface.join(", ")}.` : "")],
      etat: ih !== undefined ? "/ et /home sur des partitions choisies" : "/ sur une partition choisie" };
  }
  if (ih !== undefined) return { ok: false, note: ["alerte", "/home est choisi : choisissez aussi la place du système (/), avec « Utiliser… »."], etat: "Il manque le système (/)." };
  const p = DISQUE[sel];
  if (!p) return { ok: false, etat: "Choisissez où installer Korin OS." };
  if (p.genre === "efi" || p.genre === "rec") return { ok: false, note: ["alerte", "Cette partition sert à démarrer ou à réparer l'ordinateur : elle ne peut pas recevoir Korin."], etat: "Choisissez une autre ligne." };
  if (p.taille < MIN) return { ok: false, note: ["alerte", `Il faut au moins ${go(MIN)} pour Korin ; cette ligne n'en a que ${go(p.taille)}.`], etat: "Trop petit." };
  if (p.genre === "libre") return { ok: true, note: ["ok", `Korin s'installe dans cet espace libre (${go(p.taille)}). Rien d'autre ne change.`], etat: `Korin dans ${go(p.taille)} d'espace libre` };
  return { ok: true, danger: true, note: ["danger", `<b>Cette partition sera formatée</b> : tout ce que contient ${nomCourt(p)} sera effacé.`], etat: `Korin à la place de ${nomCourt(p)}` };
}

function rendreDisque() {
  const col = document.getElementById("col");
  col.innerHTML = "";
  col.append(el(`<h1>Où voulez-vous installer Korin OS ?</h1>`));
  col.append(el(`<p class="chapeau">Choisissez une ligne pour y installer Korin, ou donnez un rôle à des partitions existantes avec « Utiliser… » (le système, vos fichiers). Rien n'est écrit avant le résumé.</p>`));
  const liste = el(`<div class="liste"><table aria-label="Partitions du disque"><thead><tr><th>Nom</th><th class="num">Taille</th><th>Type</th><th>Utilisation</th></tr></thead><tbody></tbody></table></div>`);
  const tb = liste.querySelector("tbody");
  DISQUE.forEach((p, i) => {
    const tr = el(`<tr tabindex="0" class="${i === sel ? "sel" : ""}"><td>${p.nom}</td><td class="num">${go(p.taille)}</td><td>${p.type}</td><td class="u">${usage(i)}</td></tr>`);
    tr.onclick = () => { sel = i; rendre(); };
    tr.ondblclick = () => { sel = i; utiliser(); };
    tr.onkeydown = e => { if (e.key === "Enter") { sel = i; utiliser(); } };
    tb.append(tr);
  });
  col.append(liste);
  const p = DISQUE[sel], peut = p && p.genre !== "efi" && p.genre !== "rec" && p.genre !== "windows" || (p && p.genre === "windows");
  const liens = el(`<div class="liens"><button class="lien">↻ Actualiser</button><button class="lien" ${!p || p.genre === "libre" ? "disabled" : ""}>✕ Supprimer</button><button class="lien" ${!p || p.genre !== "libre" ? "disabled" : ""}>＋ Nouveau</button>
    <button class="lien" id="b-util" ${p && peut && p.genre !== "efi" && p.genre !== "rec" ? "" : "disabled"}>⚙ Utiliser…</button>
    <button class="lien" id="b-raz" ${Object.keys(roles).length ? "" : "disabled"}>Effacer les rôles</button></div>`);
  col.append(liens);
  liens.querySelector("#b-util").onclick = utiliser;
  liens.querySelector("#b-raz").onclick = () => { roles = {}; rendre(); };
  const v = verdict();
  if (v.note) col.append(el(`<div class="note ${v.note[0]}">${v.note[1]}</div>`));
  col.append(el(`<div class="note info">La partition EFI est gardée et réutilisée pour démarrer Korin ; le menu de démarrage proposera aussi Windows.</div>`));
  pied(false, v.etat, v.ok ? (v.danger ? "rouge" : "prim") : null, "Suivant", () => { page = v.explicite ? "internet" : "fichiers"; rendre(); });
}

function utiliser() {
  const i = sel, p = DISQUE[i];
  if (!p || p.genre === "efi" || p.genre === "rec") return;
  const cur = roles[i] || { r: "", fs: "" };
  const d = el(`<div class="voile"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="t-u">
    <h2 id="t-u">Utiliser ${nomCourt(p)} (${go(p.taille)})</h2>
    <label class="opt"><input type="radio" name="r" value="" ${!cur.r ? "checked" : ""}><span>Ne pas utiliser<small>La partition reste telle quelle.</small></span></label>
    <label class="opt"><input type="radio" name="r" value="root" ${cur.r === "root" ? "checked" : ""} ${p.taille < MIN ? "disabled" : ""}><span>Système de Korin (/)<small>${p.taille < MIN ? `Trop petite : il faut au moins ${go(MIN)}.` : "FAT32 ou exFAT."}</small></span></label>
    <label class="opt"><input type="radio" name="r" value="home" ${cur.r === "home" ? "checked" : ""}><span>Mes fichiers (/home)<small>exFAT (lisible par Windows et macOS) ou ext4.</small></span></label>
    <div id="d-fs" hidden><label>Système de fichiers : <select id="d-sel"></select></label></div>
    <p id="d-avert"></p>
    <div class="act"><button class="btn" id="d-non">Annuler</button><button class="btn prim" id="d-oui">OK</button></div>
  </div></div>`);
  document.getElementById("dlg").replaceChildren(d);
  const maj = () => {
    const r = d.querySelector('input[name="r"]:checked').value;
    const fsd = d.querySelector("#d-fs"), s = d.querySelector("#d-sel");
    fsd.hidden = !r;
    const opts = r === "root" ? [["fat32", "FAT32 (conseillé)"], ["exfat", "exFAT"]] : [["exfat", "exFAT (conseillé)"], ["ext4", "ext4 (pas encore de journal)"]];
    s.innerHTML = opts.map(o => `<option value="${o[0]}" ${cur.r === r && cur.fs === o[0] ? "selected" : ""}>${o[1]}</option>`).join("");
    d.querySelector("#d-avert").innerHTML = !r ? "" : p.genre === "libre" ? "Korin y crée une partition qui prend tout l'espace libre."
      : `<b style="color:var(--danger)">Elle sera formatée : tout ce que contient ${nomCourt(p)} sera effacé.</b>`;
  };
  d.querySelectorAll('input[name="r"]').forEach(x => x.onchange = maj);
  maj();
  d.querySelector("#d-non").onclick = () => document.getElementById("dlg").innerHTML = "";
  d.querySelector("#d-oui").onclick = () => {
    const r = d.querySelector('input[name="r"]:checked').value;
    delete roles[i];
    if (r) { const autre = ligneDe(r); if (autre !== undefined) delete roles[autre]; roles[i] = { r, fs: d.querySelector("#d-sel").value }; }
    document.getElementById("dlg").innerHTML = "";
    rendre();
  };
}

function rendreRappel(titre, texte, suivante) {
  const col = document.getElementById("col");
  col.innerHTML = "";
  col.append(el(`<h1>${titre}</h1>`));
  col.append(el(`<div class="note info">${texte}</div>`));
  pied(true, "", "prim", "Suivant", () => { page = suivante; rendre(); });
}

function rendreResume() {
  const col = document.getElementById("col");
  col.innerHTML = "";
  const ir = ligneDe("root"), ih = ligneDe("home"), p = DISQUE[sel];
  col.append(el(`<h1>${fait ? "Korin OS serait installé" : "Prêt à installer"}</h1>`));
  const v = verdict();
  const disque = ir !== undefined
    ? `/ : ${nomCourt(DISQUE[ir])}, ${go(DISQUE[ir].taille)} (${FS[roles[ir].fs]})${ih !== undefined ? ` · /home : ${nomCourt(DISQUE[ih])}, ${go(DISQUE[ih].taille)} (${FS[roles[ih].fs]})` : ""}`
    : `Korin dans ${nomCourt(p)} (${go(p.taille)})`;
  const lignes = [["Langue et clavier", "Français · BE · clavier BE"], ["Disque", disque], ["Logiciels", "4 catégories choisies"], ["Compte", "Alice (alice), administrateur"], ["Démarrage", "Menu Korin OS / Windows, Korin dans 5 s"]];
  col.append(el(`<div class="resume">${lignes.map(l => `<div><span>${l[0]}</span><span>${l[1]}</span></div>`).join("")}</div>`));
  const efface = (ir !== undefined ? [ir, ih] : [sel]).filter(i => i !== undefined && DISQUE[i].genre !== "libre");
  col.append(el(efface.length ? `<div class="note danger"><b>Seront effacées définitivement :</b> ${efface.map(i => `${nomCourt(DISQUE[i])} (${go(DISQUE[i].taille)})`).join(", ")}.</div>`
    : `<div class="note ok">Rien ne sera effacé : les partitions gardées restent telles quelles.</div>`));
  if (fait) { col.append(el(`<div class="note info">Fin de la maquette.</div>`)); pied(false, "", null, "", null, "Recommencer", () => { roles = {}; sel = 2; page = "disque"; fait = false; rendre(); }); }
  else pied(true, efface.length ? "Pour confirmer, tapez le nom du disque (dans l'app)." : "La seule écriture : ce bouton.", efface.length ? "rouge" : "prim", efface.length ? "Effacer et installer" : "Installer", () => { fait = true; rendre(); });
}

const PREC = { fichiers: "disque", internet: () => ligneDe("root") !== undefined ? "disque" : "fichiers", logiciels: "internet", compte: "logiciels", resume: "compte" };
function pied(retour, etat, style, label, fn, retLabel, retFn) {
  const pd = document.getElementById("pied");
  pd.innerHTML = "";
  const rb = el(`<button class="btn fantome" ${retour || retFn ? "" : "disabled"}>${retLabel || "Retour"}</button>`);
  rb.onclick = retFn || (() => { const q = PREC[page]; page = typeof q === "function" ? q() : q; rendre(); });
  pd.append(rb);
  pd.append(el(`<span class="etat">${etat}</span>`));
  if (label) { const b = el(`<button class="btn ${style || "prim"}" ${style ? "" : "disabled"}>${label}</button>`); if (fn) b.onclick = fn; pd.append(b); }
}

function rendre() {
  bande();
  if (page === "disque") rendreDisque();
  else if (page === "fichiers") rendreRappel("Voulez-vous une partition à part pour vos fichiers ?", "L'étape « Mes fichiers » de la maquette validée : la taille de /home prise sur la place choisie (0 : dans le système), exFAT ou ext4. Elle est sautée quand / est donné par « Utiliser… » : /home est alors une partition choisie, ou reste dans le système.", "internet");
  else if (page === "internet") rendreRappel("Se connecter à Internet", "L'étape Internet de la maquette validée.", "logiciels");
  else if (page === "logiciels") rendreRappel("Que voulez-vous installer ?", "L'étape Logiciels de la maquette validée.", "compte");
  else if (page === "compte") rendreRappel("Qui êtes-vous ?", "L'étape Compte de la maquette validée.", "resume");
  else rendreResume();
}
/* l'exemple : / sur KORIN OS (FAT32) et /home sur KORIN HOME (ext4), comme on le ferait pour repartir de zéro */
roles = { 2: { r: "root", fs: "fat32" }, 3: { r: "home", fs: "ext4" } };
rendre();
</script>
