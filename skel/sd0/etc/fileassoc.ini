# Associations des fichiers (UIKit : ui_assoc_open, ui_open_with) : « extension = application »,
# une par ligne ; l'application est le paquet /apps/<application>.app. Sans ligne ici, la
# première application dont le manifeste (app.txt : opens = ...) déclare l'extension ; sans
# application, l'Éditeur. « Ouvrir avec… », « Toujours » coché, écrit ici ; « ext = » : l'Éditeur.
# Les extensions que plusieurs applications déclarent :
txt  = editor
png  = imageview
bmp  = imageview
jpg  = imageview
jpeg = imageview
jpe  = imageview
gif  = imageview
webp = imageview
pcx  = imageview
fms  = media
# les fichiers de commandes de DOS : win16 (FreeCOM) ; sans win16 (le Pi), les manifestes
bat  = win16
