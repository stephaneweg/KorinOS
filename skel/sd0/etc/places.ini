# Acces rapides du navigateur de fichiers (panneau de gauche), dans l'ordre :
# libelle = dossier. Un dossier absent n'est pas montre. Les dossiers epingles
# depuis le navigateur s'ajoutent a la fin. L'icone vient du dossier : HOME:/
# (maison), HOME:/music, pictures, downloads, projects, documents, video, /apps ;
# un autre dossier a l'icone d'un dossier. « recent: » : les fichiers recents
# (HOME:/etc/recent-files.txt, tenu par UIKit). APPS:/ et PUBLIC:/ : les alias de vfs
# pour /apps et /home/public.
Accueil = HOME:/
Récents = recent:
Musiques = HOME:/music
Images = HOME:/pictures
Téléchargements = HOME:/downloads
Projets = HOME:/projects
Applications = APPS:/
Documents = HOME:/documents
Vidéos = HOME:/video
Public = PUBLIC:/
