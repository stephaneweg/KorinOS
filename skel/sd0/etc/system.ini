# Reglages du systeme Korin OS
#
# shell : mode de l'interface graphique (Elegant, SD0:/sys/elegant)
#   desktop : bureau (fenetres, barre des taches, menu)
#   console : pas d'interface graphique, la console texte du noyau garde l'ecran
shell=desktop
#
# lang : langue de l'interface (UIKit : TR, SD0:/res/lang/<lang>.txt) ;
#   sans cle : fr (la langue des sources)
#lang=en
