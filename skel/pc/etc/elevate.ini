# Qui peut s'elever (sudo, installer un paquet, un reglage de la machine) : des comptes
# et des groupes de /etc/users.ini (docs/etude/MULTI-UTILISATEUR.md 2.6). L'elevation
# demande le mot de passe de l'utilisateur ; un compte sans mot de passe s'eleve sans
# rien taper. Liste vide : seul system administre la machine.
[elevate]
users = user
groups = admin
