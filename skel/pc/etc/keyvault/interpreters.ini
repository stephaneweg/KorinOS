# Les interprètes dont le coffre à secrets (keyvault, docs/KEYVAULT.md) croit le script déclaré
# (SYS_PROC_SET_SCRIPT) : l'identité d'un programme qu'ils exécutent est le chemin de son script ou de son
# assembly, pas le leur. Un chemin d'exécutable par ligne, tel que le noyau le connaît (/bin/secret whoami).
# Un interprète lancé sans script (bash interactif, python3 -c) n'a pas de coffre.
/bin/bash
/bin/sh
/bin/python3
/python/bin/python3
/devtools/python/bin/python3
/devtools/dotnet/dotnet
/dotnet/dotnet
