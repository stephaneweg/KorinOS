# Batterie et énergie du PC (service acpid, docs/etude/BATTERIE-PC.md ; commande battery).
# Relu par « battery reload ». Seuils en % de la capacité à la dernière charge complète.

# alertes (une fois par décharge)
warn = 20
critical = 10
# extinction propre à ce niveau, sans secteur, après « delay » secondes (0 : jamais)
shutdown = 5
delay = 60

# profil d'énergie des cœurs : performance, balanced (équilibré), saver (économie : sans turbo),
# boot (celui du démarrage : pstate= de boot.cfg)
# profile = auto : selon le secteur ; sinon un profil fixe (battery profile …)
profile = auto
ac = boot
battery = balanced
# sous ce niveau, sur batterie : le profil « low »
saver = 20
low = saver

# lecture toutes les « poll » secondes
poll = 10
# méthodes d'initialisation de l'AML : min (\_SB, EC, batteries, secteur) ou all (toutes, comme Linux)
init = min
