# Comptes de Korin OS (docs/etude/MULTI-UTILISATEUR.md §2.1). Lisible par tous ; modifie par
# le compte system seulement (elevation, etape 4). Un compte par section :
#   uid    : 0 pour system ; 1000 et plus pour les personnes
#   name   : nom affiche ; home : dossier personnel (HOME:/) ; shell ; groups ; picture
# Le compte de la session : autologin de /etc/system.ini, sinon le premier d'uid 1000 ou plus.
# Les mots de passe ne sont pas ici (/etc/shadow.ini, etape 4).

[system]
uid = 0
name = Systeme
home = /
groups = admin

[user]
uid = 1000
name = Utilisateur
home = /home
shell = /bin/bash
groups = admin
