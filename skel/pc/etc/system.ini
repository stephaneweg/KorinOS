# Reglages du systeme Korin OS (PC)
#
# shell : mode de l'interface graphique (Elegant, /sys/elegant)
#   console : pas d'interface graphique : init2 lance la console texte
#             (/sys/svc/console : sh sur un pseudo-terminal, clavier par
#             hidmanager, ecran de la console du noyau)
#   desktop : le bureau Elegant (fond, barre de menus, panel) ; sans
#             /sys/elegant, ou s'il ne repond pas, init2 lance la console texte
shell=desktop
#
# lang : langue de l'interface (UIKit : TR, /res/lang/<lang>.txt) ;
#   sans cle : fr (la langue des sources)
#lang=en
#
# autologin : le compte ouvert au demarrage (/etc/users.ini) ; sans cle : le
#   premier compte d uid 1000 ou plus
#autologin=user
#
# access : regles d acces par chemin de vfs (docs/etude/MULTI-UTILISATEUR.md 2.3)
#   log     : les refus sont notes au journal, rien n est refuse (defaut)
#   enforce : les refus sont appliques ; off : aucune regle
#access=log
