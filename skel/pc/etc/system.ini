# Reglages du systeme Korin OS (PC)
#
# shell : mode de l'interface graphique (Elegant, SD0:/sys/elegant)
#   console : pas d'interface graphique : init2 lance la console texte
#             (SD0:/sys/svc/console : sh sur un pseudo-terminal, clavier par
#             hidmanager, ecran de la console du noyau)
#   desktop : le bureau Elegant (fond, barre de menus, panel) ; sans
#             SD0:/sys/elegant, ou s'il ne repond pas, init2 lance la console texte
shell=desktop
#
# lang : langue de l'interface (UIKit : TR, SD0:/res/lang/<lang>.txt) ;
#   sans cle : fr (la langue des sources)
#lang=en
