# Les fournisseurs OAuth 2.0 de Korin (oauthd, docs/OAUTH.md) : une section par fournisseur. Ses clés valent pour
# tout compte de ce fournisseur qui ne les donne pas lui-même : l'utilisateur n'a qu'à se connecter avec son compte,
# comme dans Mail. Un compte peut toujours donner son propre client_id (oauth setup NOM provider=google client_id=...).
#
# Ces identifiants sont ceux de l'application « Korin » chez chaque fournisseur. Pour une application installée,
# Google et Microsoft ne les considèrent pas comme secrets (client « public » ou « application de bureau ») :
# ils peuvent être livrés avec le système.
#
# Clés : client_id, client_secret, scope (par défaut), tenant (Microsoft), auth_url, token_url, device_url,
# auth_params. Les adresses de google et microsoft sont connues d'oauthd.

[google]
# l'application « Korin » de la console Google Cloud (API Drive activée, client « Application de bureau »,
# application publiée « En production », projet korin-514900 ; non vérifiée : 100 utilisateurs au plus)
client_id = 986600195377-4v8ge7jr3t2gt1cr45lvjdaqc2ecnc7s.apps.googleusercontent.com
client_secret = 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
scope = https://www.googleapis.com/auth/drive

[microsoft]
# « Onyx Mail » (Microsoft Entra, client public), le même que Mail (src/apps/mail/oauth.h)
client_id = 85ccaf6e-81ff-4a62-9194-930fc36429ad
tenant = common
