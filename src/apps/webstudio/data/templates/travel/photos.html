<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photos — {{SITE}}</title>
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div class="notebook">
    <header class="masthead">
      <div>
        <a class="title" href="index.html">{{SITE}}</a>
        <p class="subtitle">les photos du voyage</p>
      </div>
      <nav class="tabs">
        <a href="index.html">Accueil</a>
        <a href="photos.html" aria-current="page">Photos</a>
        <a href="journal.html">Journal</a>
        <a href="apropos.html">À propos</a>
      </nav>
    </header>

    <div class="wall">
      <figure class="polaroid"><span class="tape top"></span><img src="img/ruelle.jpg" alt="Une ruelle au crépuscule"><figcaption>la ruelle aux lanternes</figcaption></figure>
      <figure class="polaroid"><img src="img/grotte.jpg" alt="Une arche de roche sur la mer"><figcaption>la grotte bleue</figcaption></figure>
      <figure class="polaroid"><span class="tape tl"></span><img src="img/musicien.jpg" alt="Un guitariste sur une place"><figcaption>un concert pour nous seuls</figcaption></figure>
      <figure class="polaroid"><img src="img/falaise.jpg" alt="Une falaise orange au-dessus des bateaux"><figcaption>la falaise rouge</figcaption></figure>
      <figure class="polaroid"><span class="tape tr"></span><img src="img/cote.jpg" alt="Des falaises au soleil"><figcaption>le bout du monde</figcaption></figure>
      <figure class="polaroid"><img src="img/pont.jpg" alt="Un pont le long de la côte"><figcaption>la route du littoral</figcaption></figure>
      <figure class="polaroid"><span class="tape top"></span><img src="img/marche.jpg" alt="Un marché couvert"><figcaption>le marché couvert</figcaption></figure>
      <figure class="polaroid"><img src="img/baie.jpg" alt="Une baie verte"><figcaption>la baie verte</figcaption></figure>
      <figure class="polaroid"><span class="tape tl"></span><img src="img/rochers.jpg" alt="Des rochers dorés et l'écume"><figcaption>marée haute</figcaption></figure>
    </div>

    <footer class="foot"><span>Cliquez sur une photo pour l'agrandir ; Échap ferme.</span><span>© {{YEAR}} {{SITE}}</span></footer>
  </div>
  <div class="lightbox" hidden><figure class="polaroid"><img alt=""><figcaption></figcaption></figure></div>
  <script src="js/theme.js"></script>

</html>
