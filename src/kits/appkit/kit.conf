# AppKit : sur AArch64, toutes les fonctions gardent x1-x18 et NZCV (relais) : file_sys
# remplace un svc 0 dans la macro sys de tout programme en assembleur (x8 = numero : 7e
# argument), et des appelants en assembleur comptent sur des registres que l asm ne touchait
# pas ; f_exec_resume garde aussi x0. Aucun registre flottant (les appelants asm comptent
# dessus) ; -fwrapv : calculs en boucle comme l asm.
keep_all = *
keep_x0 = f_exec_resume
x8_arg = file_sys
cflags_aarch64 = -mgeneral-regs-only -fwrapv -fno-strict-aliasing
cflags_x86_64 = -fwrapv -fno-strict-aliasing
