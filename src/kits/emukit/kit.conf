# EmuKit : appelé par les émulateurs en assembleur (nesemu, gbemu, gbaemu, snesemu, n64emu)
# et en C++ (gcemu, n3dsemu...) : sur AArch64, toutes les fonctions gardent x1-x18 et NZCV
# (relais), comme l asm, qui ne touchait que x0-x3 et x16 dans ses petites fonctions
# (emu_frame_size, emu_pad_axes, emu_frame_same... appelées depuis l image de la machine).
# Aucun registre flottant (l asm ne touchait que q0, q1, pour recopier une ligne).
# Importe AppKit (fichiers, str_cat, fmt_dec), UIKit (la fenêtre) et AudioKit (le son),
# comme l asm.
import = appkit,uikit,audiokit
keep_all = *
cflags_aarch64 = -mgeneral-regs-only -fwrapv -fno-strict-aliasing
cflags_x86_64 = -fwrapv -fno-strict-aliasing
