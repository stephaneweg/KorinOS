# AudioKit : convention d appel normale (aucun appelant asm ne compte sur des registres hors
# AAPCS : pas de relais) ; appelle AppKit (fichiers). Les codecs calculent en flottant comme
# l asm : -ffp-contract=off (les FMA de l asm s ecrivent ak_fmadd...), sans errno ; -fwrapv :
# calculs entiers qui bouclent comme l asm. x86-64 : -fno-tree-slp-vectorize, sinon GCC range
# deux pointeurs de fonctions (d->next, d->seekfn) dans une constante de .data pour une écriture
# vectorielle : adresse absolue non relogée (saut à 0x304f0, wav_next, faute de page sur PC).
import = appkit
cflags_aarch64 = -fwrapv -fno-strict-aliasing -ffp-contract=off -fno-math-errno
cflags_x86_64 = -fwrapv -fno-strict-aliasing -ffp-contract=off -fno-math-errno -fno-tree-slp-vectorize
