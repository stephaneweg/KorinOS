# PrinterKit : appelé aussi par l applet Imprimantes de Réglages (asm, control.asm) : sur
# AArch64, toutes les fonctions gardent x1-x18 et NZCV (relais), comme l asm, qui ne
# touchait que peu de registres. Aucun registre flottant. Importe AppKit (fichiers, f_spawn,
# f_kit_load), UIKit (le dialogue) et ArchiveKit (images compressées), comme l asm.
import = appkit,uikit,archivekit
keep_all = *
cflags_aarch64 = -mgeneral-regs-only -fwrapv -fno-strict-aliasing
cflags_x86_64 = -fwrapv -fno-strict-aliasing
