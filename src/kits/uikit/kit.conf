# UIKit : appelé par des centaines de programmes en assembleur. Sur AArch64,
# toutes les fonctions gardent x1-x18 et NZCV (relais), comme AppKit : l asm
# ne touchait que peu de registres et ses appelants comptent sur les autres ;
# celles qui rendent plusieurs registres (ret) les rendent comme l asm.
# Aucun registre flottant ni SIMD hors du rasteriseur TrueType (uk_ttf.c,
# calcul flottant de ttf.asm : fp_files) ; -ffp-contract=off et fma (logicielle exacte sur x86-64 : le noyau du PC n active pas l AVX) la ou
# l asm a fmadd / fmsub. Importe AppKit (fmt_dec, str_cat, lang_*).
import = appkit
keep_all = *
ret = ui_popup:012,ui_popup_ex:012,ui_popup_local:012,ui_menu_get:012,ui_w_event:012,ui_list_get:01,ui_text_hit:01,ui_textbox_selection:01,ui_textarea_caret:01,ui_image_size:012,ui_drop_get:01,ui_tree_get:01,ui_list_sorted:01,ui_canvas_pixels:012,ui_surface_pixels:0123,ui_clip_put:03,ui_clip_take:01,ui_clip_get_image:012,ui_clip_get_files:01
fp_files = uk_ttf.c
cflags_aarch64 = -mgeneral-regs-only -fwrapv -fno-strict-aliasing -ffp-contract=off
cflags_x86_64 = -fwrapv -fno-strict-aliasing -ffp-contract=off -msse4.1
