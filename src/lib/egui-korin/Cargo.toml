[package]
name = "egui-korin"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "egui sur Korin OS : une fenêtre UIKit, le dessin par le CPU, les entrées (docs/EGUI.md)"
publish = false

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
# le rendu d'egui par le CPU (egui_software_backend 0.0.3 porté sur egui 0.37) : il dessine dans un tampon BGRA,
# celui de la fenêtre de Korin (0x00RRGGBB en petit-boutiste)
hdrshot-egui-backend = { version = "=0.2.0", default-features = false, features = ["std"] }
log = "0.4"

[build-dependencies]
cc = "1"

[dev-dependencies]
egui_demo_lib = { version = "0.37", default-features = false }

[[example]]
name = "demo"
